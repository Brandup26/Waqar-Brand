<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وقار | WQAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* أنيميشن اللوجو وكرييتف لودر */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fffafb; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.8s ease;
        }
        #splash-screen img { width: 220px; animation: creativePulse 4s ease-in-out forwards; }
        @keyframes creativePulse { 
            0% { transform: scale(0.8) rotate(0deg); opacity: 0; } 
            50% { transform: scale(1.1) rotate(5deg); opacity: 1; } 
            100% { transform: scale(1) rotate(0deg); opacity: 0.8; } 
        }
        #progress-container { width: 200px; height: 4px; background: #eee; margin-top: 20px; border-radius: 2px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #ff69b4; animation: load 4s linear forwards; }
        #percentage { margin-top: 10px; font-weight: bold; color: #ff69b4; }
        @keyframes load { to { width: 100%; } }

        body { font-family: 'Tajawal', sans-serif; background: #fffafb; color: #333; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body.dark-mode { background: #1a1a1a; color: #f1f1f1; }
        body.dark-mode .item-card { background: #2d2d2d; }
        body.dark-mode .item-card h3 { color: #f1f1f1; }

        header { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('images/brand.jpg') center/cover; height: 35vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; }
        
        .theme-toggle { position: absolute; top: 15px; left: 15px; cursor: pointer; font-size: 1.5rem; z-index: 1000; user-select: none; }
        
        .divider-container { text-align: center; margin-top: 30px; }
        .divider { height: 2px; background: #ff69b4; margin: 10px auto; width: 60px; border-radius: 5px; }
        .collection-title { font-weight: bold; color: #ff69b4; margin-bottom: 5px; }
        
        .container { padding: 0 10px 20px 10px; max-width: 500px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card { background: #fff; padding: 10px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .item-card img { width: 100%; height: 150px; object-fit: contain; border-radius: 15px; }
        .item-card h3 { margin: 10px 0 5px 0; font-size: 1rem; font-weight: 700; color: #222; }
        
        .btn-details { background: #ff69b4; color: #fff; border: none; padding: 8px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.8rem; }
        
        /* إزالة المربع الأزرق نهائياً من أي عنصر تفاعلي */
        *:focus { outline: none !important; -webkit-tap-highlight-color: transparent !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="images/logo brand.jpg" alt="Logo">
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="percentage">0%</div>
    </div>

    <div class="theme-toggle" id="theme-icon" onclick="toggleTheme()">🌙</div>

    <header>
        <h1>وقار</h1>
        <p>وقار .. اختيارك للوقار بكل تفاصيله ❤️</p>
    </header>

    <div class="divider-container">
        <div class="collection-title">Collection 🔥</div>
        <div class="divider"></div>
    </div>

    <div class="container" id="collection"></div>

    <script>
        // إعدادات شاشة البداية
        let count = 0;
        let counter = setInterval(() => {
            if(count < 100) { count++; document.getElementById('percentage').innerText = count + "%"; }
            else { clearInterval(counter); }
        }, 40);

        window.onload = () => { setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 800); }, 4000); };

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSMKhHdK0M6unNQwdEsFoY72WO9prnqXk5z9XiuNJJfzbQm0_Gxn2Q0GCl0pBXAophE7b_pK2MdR3p/pub?output=csv';
        
        fetch(csvUrl).then(res => res.text()).then(data => {
            const rows = data.split('\n').slice(1);
            const container = document.getElementById('collection');
            rows.forEach(row => {
                const cols = row.split(',');
                if(cols[0] && !isNaN(cols[0]) && cols[1]) {
                    const id = cols[0].trim();
                    const name = cols[1].trim();
                    container.innerHTML += `
                        <div class="item-card">
                            <img src="images/${name}.jpg" alt="${name}">
                            <h3>${name}</h3>
                            <button class="btn-details" onclick="window.location.href='details.html?id=${id}'">عرض التفاصيل</button>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>
</html>
