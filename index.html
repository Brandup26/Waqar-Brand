<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>وقار | WQAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0a0a0a; color: #fff; margin: 0; }
        header { background: url('brand.jpg') center/cover; height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        header h1 { font-size: 3.5rem; margin: 0; }
        header p { font-size: 1.2rem; opacity: 0.8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 50px; }
        .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 25px; text-align: center; }
        .card img { border-radius: 20px; width: 100%; height: 300px; object-fit: cover; }
        .category { color: #aaa; font-size: 0.9rem; margin-bottom: 10px; }
        button { background: #fff; color: #000; border: none; padding: 12px 30px; border-radius: 15px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>وقار</h1>
        <p>الجملة الدعائية الخاصة بالبراند</p>
    </header>

    <div class="grid" id="collection"></div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSMKhHdK0M6unNQwdEsFoY72WO9prnqXk5z9XiuNJJfzbQm0_Gxn2Q0GCl0pBXAophE7b_pK2MdR3p/pub?output=csv';
        fetch(csvUrl).then(res => res.text()).then(data => {
            const rows = data.split('\n').slice(1);
            const grid = document.getElementById('collection');
            rows.forEach(row => {
                const [id, name, price, img, cat] = row.split(',');
                if(id) {
                    grid.innerHTML += `
                        <div class="card">
                            <div class="category">${cat}</div>
                            <img src="${img}" alt="${name}">
                            <h3>${name}</h3>
                            <button onclick="window.location.href='details.html?id=${id}'">عرض التفاصيل</button>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>
</html>
