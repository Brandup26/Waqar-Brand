<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fffafb; color: #333; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: auto; padding-bottom: 50px; }
        .swiper { width: 100%; height: 350px; border-radius: 0 0 30px 30px; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        h1 { color: #ff69b4; }
        .price { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; }
        
        .notes-container { 
            background: #fff0f7; padding: 15px; border-radius: 15px; 
            border: 1px solid #ff69b4; margin: 15px 0;
        }
        .notes-label { font-weight: bold; color: #ff69b4; display: block; margin-bottom: 5px; }
        .buy-btn { background: #ff69b4; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="details"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // ... داخل دالة الـ fetch
    fetch(csvUrl).then(res => res.text()).then(data => {
        const lines = data.split('\n');
        const row = lines.find(r => r.startsWith(id + ',')).split(',');
        
        // الترتيب: 7 هو الوصف (Description)، و 8 هو الملاحظة (Note)
        const description = row[7]; 
        const notes = row[8]; 

        document.getElementById('details').innerHTML = `
            <!-- ... باقي الكود -->
            <p>${description}</p>
            <div class="notes-container">
                <span class="notes-label">ملحوظة:</span>
                ${notes}
            </div>
            <!-- ... باقي الكود -->
        `;
        new Swiper('.swiper', {});
    });
</script>
