<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fffafb; color: #333; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: auto; }
        
        /* إخفاء أي شيء أثناء التحميل */
        #details { opacity: 0; transition: opacity 0.5s; }
        
        .swiper { width: 100%; height: 350px; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        h1 { color: #ff69b4; text-align: center; }
        .price { font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; background: #fff; font-family: 'Tajawal', sans-serif; }
        .note-box { background: #ffeef5; padding: 15px; border-radius: 15px; border: 1px solid #ff69b4; margin: 15px 0; }
        .buy-btn { background: #ff69b4; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>

<div class="container" id="details"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const id = new URLSearchParams(window.location.search).get('id');
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSMKhHdK0M6unNQwdEsFoY72WO9prnqXk5z9XiuNJJfzbQm0_Gxn2Q0GCl0pBXAophE7b_pK2MdR3p/pub?output=csv';

    fetch(csvUrl).then(res => res.text()).then(data => {
        const lines = data.split('\n');
        // البحث عن الصف باستخدام الـ ID
        const row = lines.find(r => r.startsWith(id + ','));
        
        if (row) {
            const cols = row.split(',');
            const displayName = cols[1].trim();
            const imageCode = cols[9].trim();
            const encodedImage = encodeURIComponent(imageCode);

            document.getElementById('details').innerHTML = `
                <div class="swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="images/${encodedImage}%201.jpg"></div>
                        <div class="swiper-slide"><img src="images/${encodedImage}%202.jpg"></div>
                        <div class="swiper-slide"><img src="images/${encodedImage}%203.jpg"></div>
                    </div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                </div>
                <div class="content">
                    <h1>${displayName}</h1>
                    <div class="price">${cols[2]} ج.م</div>
                    <p>${cols[7]}</p>
                    
                    <select><option selected disabled>Size</option>${cols[5].split('-').map(s => `<option>${s.trim()}</option>`).join('')}</select>
                    <select><option selected disabled>Colour</option>${cols[6].split('-').map(c => `<option>${c.trim()}</option>`).join('')}</select>
                    
                    <div class="note-box">
                        <strong>ملاحظة:</strong> ${cols[3]}
                    </div>
                    <button class="buy-btn">إتمام الطلب عبر واتساب</button>
                </div>
            `;
            // إظهار المحتوى فور التحميل
            document.getElementById('details').style.opacity = 1;
            new Swiper('.swiper', { navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' } });
        }
    }).catch(err => {
        console.error("خطأ في التحميل", err);
        // في حال فشل التحميل، ممكن تحول الزائر لصفحة تانية أو تظهر رسالة
    });
</script>
</body>
</html>
