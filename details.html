<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وقار | WQAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fffafb; color: #333; margin: 0; padding: 0; }
        
        header { 
            /* تم تحديث المسار هنا ليصبح images/brand.jpg */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('images/brand.jpg') center/cover; 
            height: 35vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; color: white;
        }
        header h1 { margin: 0; font-size: 2.5rem; }
        header p { margin: 10px 0; font-size: 1.1rem; }

        .divider { height: 2px; background: #ff69b4; margin: 30px auto; width: 60px; border-radius: 5px; }

        .container { padding: 0 20px 20px 20px; max-width: 500px; margin: auto; }
        
        .item-card { 
            background: #fff; padding: 15px; border-radius: 20px; 
            margin-bottom: 25px; text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        
        .item-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 15px; }
        
        .item-card h3 { margin: 15px 0 10px 0; font-size: 1.3rem; font-weight: 700; color: #222; }
        
        .btn-details { 
            background: #ff69b4; color: #fff; border: none; padding: 12px 25px; 
            border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s;
        }
        .btn-details:hover { background: #ff1493; }
    </style>
</head>
<body>

    <header>
        <h1>وقار</h1>
        <p>وقار .. اختيارك للوقار بكل تفاصيله ❤️</p>
    </header>

    <div class="divider"></div>

    <div class="container" id="collection"></div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSMKhHdK0M6unNQwdEsFoY72WO9prnqXk5z9XiuNJJfzbQm0_Gxn2Q0GCl0pBXAophE7b_pK2MdR3p/pub?output=csv';
        
        fetch(csvUrl).then(res => res.text()).then(data => {
            const rows = data.split('\n').slice(1);
            const container = document.getElementById('collection');
            
            rows.forEach(row => {
                const cols = row.split(',');
                if(cols[0] && cols[1]) {
                    container.innerHTML += `
                        <div class="item-card">
                            <img src="${cols[3].trim()}" alt="${cols[1]}">
                            <h3>${cols[1]}</h3>
                            <button class="btn-details" onclick="window.location.href='details.html?id=${cols[0]}'">عرض التفاصيل</button>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>
</html>
