<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fffafb; color: #333; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        h1 { color: #ff69b4; text-align: center; }
        .price { font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; background: #fff; }
        .note-box { background: #ffeef5; padding: 15px; border-radius: 15px; border: 1px solid #ff69b4; margin: 15px 0; }
        .buy-btn { background: #ff69b4; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="details">جاري التحميل...</div>

<script>
    const id = new URLSearchParams(window.location.search).get('id');
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSMKhHdK0M6unNQwdEsFoY72WO9prnqXk5z9XiuNJJfzbQm0_Gxn2Q0GCl0pBXAophE7b_pK2MdR3p/pub?output=csv';

    fetch(csvUrl).then(res => res.text()).then(data => {
        const row = data.split('\n').find(r => r.startsWith(id + ',')).split(',');
        
        // الترتيب الجديد:
        // row[1]: Name, row[2]: Price, row[3]: Note, row[5]: Sizes, row[6]: Colors, row[7]: Description, row[8]: ImagePath
        document.getElementById('details').innerHTML = `
            <h1>${row[1]}</h1>
            <div class="price">${row[2]} ج.م</div>
            <p>${row[7]}</p>
            
            <select><option>Size: ${row[5]}</option></select>
            <select><option>Colour: ${row[6]}</option></select>
            
            <div class="note-box">
                <strong>ملاحظة:</strong> ${row[3]}
            </div>
            
            <button class="buy-btn" onclick="window.open('https://wa.me/201000000000')">إتمام الطلب عبر واتساب</button>
        `;
    });
</script>
</body>
</html>
