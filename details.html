<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fffafb; color: #333; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: auto; padding-bottom: 50px; }
        .swiper { width: 100%; height: 350px; border-radius: 0 0 30px 30px; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        h1 { color: #ff69b4; margin-bottom: 5px; }
        .price { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; }
        .note-box { background: #fff0f7; padding: 15px; border-radius: 15px; border: 1px solid #ff69b4; margin: 15px 0; color: #555; }
        .buy-btn { background: #ff69b4; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="details"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const id = new URLSearchParams(window.location.search).get('id');
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSMKhHdK0M6unNQwdEsFoY72WO9prnqXk5z9XiuNJJfzbQm0_Gxn2Q0GCl0pBXAophE7b_pK2MdR3p/pub?output=csv';

    fetch(csvUrl).then(res => res.text()).then(data => {
        const rows = data.split('\n');
        // هنا نبحث عن الصف الذي يبدأ بالـ ID
        const rawRow = rows.find(r => r.startsWith(id + ','));
        
        // حل جذري: نستخدم تعبير منتظم (Regex) لتقسيم الصف مع مراعاة الفواصل داخل النصوص
        const row = rawRow.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g).map(s => s.replace(/"/g, ''));
        
        // الآن الـ Note دائماً سيكون في آخر عنصر في المصفوفة مهما كان طول الصف
        const noteText = row[row.length - 1];

        document.getElementById('details').innerHTML = `
            <div class="swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="${row[3].trim()}.jpg"></div>
                </div>
            </div>
            <div class="content">
                <h1>${row[1]}</h1>
                <div class="price">${row[2]} ج.م</div>
                <p>${row[7]}</p>
                <select>${row[5].split('-').map(s => `<option>${s.trim()}</option>`).join('')}</select>
                <select>${row[6].split('-').map(c => `<option>${c.trim()}</option>`).join('')}</select>
                
                <div class="note-box">
                    <strong>ملحوظة:</strong><br>${noteText}
                </div>
                
                <button class="buy-btn">إتمام الطلب عبر واتساب</button>
            </div>
        `;
        new Swiper('.swiper', {});
    });
</script>
</body>
</html>
