<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fffafb; padding: 20px; text-align: center; }
        .loading { color: #ff69b4; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="details" class="loading">جاري تحميل البيانات...</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    if (!id) {
        document.getElementById('details').innerHTML = "خطأ: لم يتم تحديد المنتج!";
    } else {
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSMKhHdK0M6unNQwdEsFoY72WO9prnqXk5z9XiuNJJfzbQm0_Gxn2Q0GCl0pBXAophE7b_pK2MdR3p/pub?output=csv';

        fetch(csvUrl)
            .then(res => res.text())
            .then(data => {
                const lines = data.split('\n');
                const row = lines.find(r => r.startsWith(id + ','));
                
                if (!row) {
                    document.getElementById('details').innerHTML = "خطأ: لم نجد المنتج رقم " + id;
                    return;
                }

                const cols = row.split(',');
                // طباعة البيانات للتأكد من وصولها
                console.log("البيانات المستلمة:", cols);

                document.getElementById('details').innerHTML = `
                    <h1>${cols[1]}</h1>
                    <p>السعر: ${cols[2]} ج.م</p>
                    <p>الملاحظة: ${cols[3]}</p>
                `;
            })
            .catch(err => {
                document.getElementById('details').innerHTML = "حدث خطأ أثناء الاتصال بالشيت.";
            });
    }
</script>
</body>
</html>
