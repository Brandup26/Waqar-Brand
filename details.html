<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفاصيل المنتج</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Tajawal', sans-serif; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: rgba(255,255,255,0.03); padding: 30px; border-radius: 30px; }
        .note { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 15px; border-right: 5px solid #fff; margin-top: 20px; }
        select, input { padding: 12px; border-radius: 10px; width: 100%; margin-top: 10px; background: #222; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="container" id="product-details">جاري تحميل البيانات...</div>

    <script>
        const productId = new URLSearchParams(window.location.search).get('id');
        fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vQSMKhHdK0M6unNQwdEsFoY72WO9prnqXk5z9XiuNJJfzbQm0_Gxn2Q0GCl0pBXAophE7b_pK2MdR3p/pub?output=csv')
            .then(res => res.text()).then(data => {
                const row = data.split('\n').slice(1).find(r => r.split(',')[0] == productId).split(',');
                document.getElementById('product-details').innerHTML = `
                    <h1>${row[1]}</h1>
                    <p><strong>القسم:</strong> ${row[4]}</p>
                    <img src="${row[3]}" width="100%" style="border-radius:20px;">
                    <p><strong>السعر:</strong> ${row[2]} جنيه</p>
                    <p>${row[7]}</p>
                    <label>المقاس:</label><select><option>${row[5]}</option></select>
                    <label>اللون:</label><select><option>${row[6]}</option></select>
                    <div class="note"><h4>ملحوظة هامة:</h4><p>${row[8]}</p></div>
                    <button onclick="alert('تم الطلب!')" style="width:100%; padding:15px; margin-top:20px; background:#fff; border:none; border-radius:15px; font-weight:bold; cursor:pointer;">شراء الآن</button>
                `;
            });
    </script>
</body>
</html>
